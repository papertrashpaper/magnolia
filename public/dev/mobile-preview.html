<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnolia スマホ表示プレビュー</title>
<style>body{margin:0;background:#21150f;color:#f2e4c7;font:14px system-ui;text-align:center}nav{height:52px;display:flex;gap:10px;align-items:center;justify-content:center}select{font:inherit;padding:6px}iframe{display:block;width:390px;height:844px;max-width:100%;border:1px solid #ad8a55;border-radius:10px;margin:0 auto;background:#21150f}body:has(option[value="568"]:checked) iframe{height:568px}</style>
<nav><label>幅 <select id="width"><option>320</option><option selected>390</option><option>430</option></select></label><label>高さ <select id="height"><option>568</option><option selected>844</option></select></label></nav><iframe title="スマホのゲーム画面" src="../index.html"></iframe>
<script>const frame=document.querySelector('iframe');for(const dimension of ['width','height'])document.getElementById(dimension).onchange=e=>{frame.style[dimension]=e.target.value+'px';};</script></html>
