<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnolia 表示確認</title><style>body{margin:0;background:#20252b;color:#eee;font:14px system-ui}header{height:62px;display:flex;gap:12px;align-items:center;justify-content:center}select{font:inherit;padding:8px}main{display:flex;justify-content:center;padding:8px 12px 20px}iframe{width:390px;height:844px;border:5px solid #080808;border-radius:12px;background:white;flex-shrink:0}</style></head><body><header><label>画面幅 <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>667</option></select></label><label>高さ <select id="height"><option>375</option><option>667</option><option selected>844</option><option>932</option></select></label></header><main><iframe id="phone" title="スマホ表示のゲーム" src="./"></iframe></main><script>for(const id of ['width','height'])document.getElementById(id).onchange=e=>document.getElementById('phone').style[id]=e.target.value+'px';</script></body></html>
