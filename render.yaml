services:
  - type: web
    name: magnolia
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: ALLOWED_ORIGINS
        value: https://papertrashpaper.github.io
